<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 2 - School Memories</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
    <iframe src="music.html" style="display:none;"></iframe>


<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>



<div class="container">


<h1 class="title">

Chapter 2

</h1>



<h2 class="subtitle">

The Golden School Days

</h2>




<p class="story" id="text"></p>



<br><br>



<a href="chapter3.html">

<button>

Continue →

</button>

</a>



</div>





<script>


const story = `

Days turned into years...

Three seats.

Three smiles.

Three different minds.

From sharing lunch boxes,

laughing during classes,

fighting over silly things,

and creating memories that only we understand.

Those small moments became the biggest memories of our lives.

Every laugh, every secret, every silly fight...

Slowly created a bond that made our trio special.

`;



let index = 0;

let textBox = document.getElementById("text");



function typing(){


if(index < story.length){


textBox.innerHTML += story.charAt(index);


index++;


setTimeout(typing,40);


}


}


typing();





// Continue Music


let music = document.getElementById("music");


let savedTime =
localStorage.getItem("musicTime");



if(savedTime){

music.currentTime =
parseFloat(savedTime);

}



music.volume = 0.4;



music.play().catch(()=>{

console.log("Click required for music");

});




setInterval(()=>{


localStorage.setItem(

"musicTime",

music.currentTime

);


},1000);



</script>


</body>

</html>
