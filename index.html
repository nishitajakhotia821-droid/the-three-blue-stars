<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Friendship Story ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>


<body>


<!-- Background -->

<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<!-- Music -->

<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>



<!-- Loading Screen -->

<div id="loading">


<h2>
Loading Memories...
</h2>


<div class="loader">

<div class="line"></div>

</div>


<p id="percent">
0%
</p>


</div>




<!-- Main Story -->


<section id="home" class="hidden">


<div class="intro-card">


<h1 class="title">

Happy Friendship Day ❤️

</h1>



<h2 class="subtitle">

From Standard 6...

<br>

To Third Year...

<br><br>


Three people.

Three personalities.

One unforgettable journey.


</h2>




<p class="intro-text">


A story of laughter,

memories,

dreams,

and a friendship that stayed strong through every chapter.


</p>



<button id="startBtn">

Begin Our Journey →

</button>



</div>


</section>




<script src="script.js"></script>


</body>

</html>
