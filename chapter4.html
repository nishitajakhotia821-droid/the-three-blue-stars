<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 4 - The Farewell</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
    <iframe src="music.html" style="display:none;"></iframe>


<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>




<div class="container">


<h1 class="title">

Chapter 4

</h1>



<h2 class="subtitle">

The Last School Chapter

</h2>




<p class="story" id="text"></p>



<br><br>



<a href="chapter5.html">

<button>

Continue →

</button>

</a>



</div>






<script>


const story = `

And then...

The day we never wanted arrived.

The last classroom.

The last school bell.

The last walk through those corridors.

We knew life was changing.

New places.

New people.

New dreams.

Maybe we would not sit together

every day anymore...

But the memories we created

would always stay with us.

Because some friendships

don't end with a goodbye...

They begin a new chapter.

`;



let index = 0;

let textBox = document.getElementById("text");



function typing(){


if(index < story.length){


textBox.innerHTML += story.charAt(index);


index++;


setTimeout(typing,40);


}


}



typing();






// Music Continue


let music = document.getElementById("music");


let savedTime =
localStorage.getItem("musicTime");



if(savedTime){

music.currentTime =
parseFloat(savedTime);

}



music.volume = 0.4;



music.play().catch(()=>{

console.log("Music waiting for permission");

});





setInterval(()=>{


localStorage.setItem(

"musicTime",

music.currentTime

);


},1000);



</script>


</body>

</html>
