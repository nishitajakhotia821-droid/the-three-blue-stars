<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 1 - The Beginning</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
    <iframe src="music.html" style="display:none;"></iframe>


<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<!-- Music -->

<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>



<div class="container">


<h1 class="title">

Chapter 1

</h1>



<h2 class="subtitle">

The Beginning Of Our Story

</h2>




<p class="story" id="text"></p>



<br><br>



<a href="chapter2.html">

<button>

Continue →

</button>

</a>



</div>





<script>


// Story Text

const story = `

Standard 6...

Three different people.

Three different personalities.

One classroom.

We never knew that a simple meeting would become a friendship filled with laughter, memories, and countless unforgettable moments.

From small conversations to endless memories...

That was the beginning of our trio.

`;




// Typewriter


let index = 0;

const textBox = document.getElementById("text");



function typing(){


if(index < story.length){


textBox.innerHTML += story.charAt(index);


index++;


setTimeout(typing,40);


}


}



typing();





// Continue Music


let music = document.getElementById("music");


let savedTime =
localStorage.getItem("musicTime");



if(savedTime){

music.currentTime =
savedTime;

}




music.volume = 0.4;



music.play().catch(()=>{

console.log("Music waiting for user");

});




setInterval(()=>{


localStorage.setItem(

"musicTime",

music.currentTime

);


},1000);



</script>



</body>

</html>
