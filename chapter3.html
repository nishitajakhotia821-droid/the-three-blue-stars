<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 3 - Growing Together</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
    <iframe src="music.html" style="display:none;"></iframe>


<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>




<div class="container">


<h1 class="title">

Chapter 3

</h1>



<h2 class="subtitle">

Growing Together

</h2>




<p class="story" id="text"></p>



<br><br>



<a href="chapter4.html">

<button>

Continue →

</button>

</a>



</div>






<script>


const story = `

Time kept moving...

We were no longer the same kids

who met in Standard 6.

We started discovering ourselves.

Our dreams.

Our goals.

Our future.

Three different journeys...

Three different personalities...

But one strong bond.

We celebrated each other's victories,

stood together during difficult times,

and learned that true friendship

is not about being together every day...

It is about knowing

someone will always be there.

`;



let index = 0;

let textBox = document.getElementById("text");



function typing(){


if(index < story.length){


textBox.innerHTML += story.charAt(index);


index++;


setTimeout(typing,40);


}


}



typing();






// Music Continue


let music = document.getElementById("music");


let savedTime =
localStorage.getItem("musicTime");



if(savedTime){

music.currentTime =
parseFloat(savedTime);

}



music.volume = 0.4;



music.play().catch(()=>{

console.log("Music waiting for permission");

});





setInterval(()=>{


localStorage.setItem(

"musicTime",

music.currentTime

);


},1000);



</script>


</body>

</html>
