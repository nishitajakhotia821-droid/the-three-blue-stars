<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chapter 5 - Different Paths</title>

<link rel="stylesheet" href="style.css">

</head>


<body>
    <iframe src="music.html" style="display:none;"></iframe>


<div class="stars"></div>
<div class="stars2"></div>
<div class="overlay"></div>



<audio id="music" loop>

<source src="music.mp3" type="audio/mp3">

</audio>




<div class="container">


<h1 class="title">

Chapter 5

</h1>



<h2 class="subtitle">

Different Colleges, Same Dream

</h2>




<p class="story" id="text"></p>



<br><br>



<a href="chapter6.html">

<button>

Final Chapter →

</button>

</a>



</div>






<script>


const story = `

Today...

We are in our 3rd year.

Three friends.

Three different colleges.

Different classrooms.

Different schedules.

Different challenges.

But still connected by

the same memories

and the same friendship.

We are following our dreams,

building our careers,

and creating our own stories.

The journey changed...

but our trio never did.

Because real friendships

don't need daily meetings.

They only need a special place

in the heart.

`;



let index = 0;

let textBox = document.getElementById("text");



function typing(){


if(index < story.length){


textBox.innerHTML += story.charAt(index);


index++;


setTimeout(typing,40);


}


}



typing();






// Music Continue


let music = document.getElementById("music");


let savedTime =
localStorage.getItem("musicTime");



if(savedTime){

music.currentTime =
parseFloat(savedTime);

}



music.volume = 0.4;



music.play().catch(()=>{

console.log("Music waiting for permission");

});





setInterval(()=>{


localStorage.setItem(

"musicTime",

music.currentTime

);


},1000);



</script>


</body>

</html>
